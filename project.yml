name: Daybook
options:
  bundleIdPrefix: com.altmihai31
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  DaybookKit:
    path: Packages/DaybookKit
targets:
  Daybook:
    type: application
    platform: iOS
    sources:
      - Daybook/Sources
      - Daybook/Resources
    dependencies:
      - package: DaybookKit
    info:
      path: Daybook/Info.plist
      properties:
        CFBundleDisplayName: Daybook
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        NSCalendarsFullAccessUsageDescription: Daybook shows and edits the events in your iCloud, Google and Outlook calendars.
        NSCalendarsUsageDescription: Daybook shows and edits the events in your iCloud, Google and Outlook calendars.
        NSRemindersFullAccessUsageDescription: Daybook shows your Apple Reminders as tasks next to your events.
        NSRemindersUsageDescription: Daybook shows your Apple Reminders as tasks next to your events.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altmihai31.daybook
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  DaybookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DaybookUITests
    dependencies:
      - target: Daybook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altmihai31.daybook.uitests
        TEST_TARGET_NAME: Daybook
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Daybook:
    build:
      targets:
        Daybook: all
        DaybookUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - DaybookUITests
