name: iOS build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  logic-tests:
    name: Logic unit tests (DaybookKit)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test --package-path Packages/DaybookKit

  app:
    name: Build, UI tests, screenshots, unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: which xcodegen || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devs in data.items():
              if "iOS" not in runtime:
                  continue
              ver = tuple(int(x) for x in runtime.split("iOS-")[-1].split("-") if x.isdigit())
              for d in devs:
                  name = d["name"]
                  if not name.startswith("iPhone") or "SE" in name or "mini" in name:
                      continue
                  score = (ver, "Pro" in name and "Max" not in name, name)
                  if best is None or score > best[0]:
                      best = (score, d["udid"], name, runtime)
          print(best[1])
          print(best[2] + " / " + best[3], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: UI tests in the iPhone Simulator
        run: |
          mkdir -p screenshots
          set -o pipefail
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project Daybook.xcodeproj -scheme Daybook \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/UITests.xcresult \
            -derivedDataPath build/dd-sim \
            CODE_SIGNING_ALLOWED=NO | tee build-test.log | grep -E "error:|warning: unre|Test Case|Executed|\*\*" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build-test.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: warn

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/UITests.xcresult
            build-test.log

      - name: Build unsigned .ipa
        run: |
          set -o pipefail
          xcodebuild build \
            -project Daybook.xcodeproj -scheme Daybook -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tee build-ipa.log | grep -E "error:|\*\*" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build-ipa.log
          rm -rf Payload && mkdir Payload
          cp -R build/dd-device/Build/Products/Release-iphoneos/Daybook.app Payload/
          zip -qry Daybook.ipa Payload
          ls -lh Daybook.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Daybook-ipa
          path: Daybook.ipa

      - name: Publish .ipa to the "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Daybook.ipa --title "Daybook (latest main build)" \
            --notes "Unsigned build from ${GITHUB_SHA::7}. Install with Sideloadly using your Apple ID; it expires after 7 days with a free account." \
            --prerelease
